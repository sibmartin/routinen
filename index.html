<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Meine Routine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS: als "App" vom Home-Bildschirm starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Routine">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#7ec8f0">

  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="morning" ontouchstart="">

  <!-- Hintergrund-Deko (Morgen) -->
  <div class="scene scene-morning" aria-hidden="true">
    <div class="sun"><div class="sun-rays"></div><div class="sun-core"></div></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="bird bird-1">🐦</div>
    <div class="bird bird-2">🐤</div>
    <div class="butterfly">🦋</div>
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>
    <div class="flowers">🌷 🌼 🌻 🌷 🌼</div>
  </div>

  <!-- Hintergrund-Deko (Abend) -->
  <div class="scene scene-evening" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="shooting-star"></div>
    <div class="hill hill-back night"></div>
    <div class="hill hill-front night"></div>
    <div class="branch"></div>
    <div class="owl">🦉</div>
    <div class="zzz">z<span>z</span><span>z</span></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="kids" id="kids"></div>
      <div class="clock" id="clock" aria-label="Uhrzeit">
        <svg class="clock-face" viewBox="0 0 40 40">
          <circle class="cf-bg" cx="20" cy="20" r="17.5"/>
          <g class="cf-ticks" id="clockTicks"></g>
          <line class="cf-h" id="hHand" x1="20" y1="20" x2="20" y2="11.5"/>
          <line class="cf-m" id="mHand" x1="20" y1="20" x2="20" y2="7.5"/>
          <line class="cf-s" id="sHand" x1="20" y1="23.5" x2="20" y2="6"/>
          <circle class="cf-c" cx="20" cy="20" r="1.8"/>
        </svg>
        <div class="clock-digits">
          <span class="d" id="clkH">00</span><span class="colon">:</span><span class="d" id="clkM">00</span>
        </div>
      </div>
      <div class="routine-switch" id="routineSwitch">
        <button class="routine-btn" data-routine="morning"><span class="ico">☀️</span><span class="txt">Morgen</span></button>
        <button class="routine-btn" data-routine="evening"><span class="ico">🌙</span><span class="txt">Abend</span></button>
      </div>
      <button class="gear" id="gearBtn" aria-label="Einstellungen">⚙️</button>
    </header>

    <div class="progress-row">
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>

    <main class="grid" id="grid"></main>

    <footer class="bottombar">
      <button class="reset-btn" id="resetBtn">↺ Alles zurücksetzen</button>
    </footer>
  </div>

  <!-- Bestätigung Zurücksetzen -->
  <div class="modal" id="confirmModal">
    <div class="dialog small">
      <div class="dialog-emoji">🧹</div>
      <h2 id="confirmText">Alles zurücksetzen?</h2>
      <div class="dialog-actions">
        <button class="btn btn-grey" id="confirmNo">Nein</button>
        <button class="btn btn-red" id="confirmYes">Ja, zurücksetzen</button>
      </div>
    </div>
  </div>

  <!-- Einstellungen -->
  <div class="modal" id="settingsModal">
    <div class="dialog settings">
      <div class="settings-head">
        <h2 id="settingsTitle">Einstellungen</h2>
        <button class="btn btn-green" id="settingsDone">Fertig ✓</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <h3>Name</h3>
          <input type="text" class="name-input" id="nameInput" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
        </div>
        <div class="settings-section">
          <h3>Bild</h3>
          <div class="avatars" id="avatarPicker"></div>
        </div>
        <div class="settings-tabs" id="settingsTabs">
          <button class="tab" data-routine="morning">☀️ Morgenroutine</button>
          <button class="tab" data-routine="evening">🌙 Abendroutine</button>
        </div>
        <div class="settings-section">
          <h3>Ausgewählte Kacheln <span class="count" id="selCount"></span></h3>
          <p class="hint">Mit ▲ ▼ die Reihenfolge ändern, mit ✕ entfernen.</p>
          <div class="sel-list" id="selList"></div>
        </div>
        <div class="settings-section">
          <h3>Kachel hinzufügen</h3>
          <p class="hint" id="addHint">Antippen, um die Kachel hinzuzufügen. Maximal 12 Kacheln pro Routine.</p>
          <div class="pool" id="pool"></div>
        </div>
        <div class="settings-section center">
          <button class="btn btn-grey" id="restoreDefaults">Standard-Kacheln wiederherstellen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Belohnungs-Animation -->
  <div class="celebrate" id="celebrate">
    <div class="celebrate-stage" id="celebrateStage"></div>
    <div class="celebrate-msg" id="celebrateMsg"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
